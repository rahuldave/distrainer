# toy_contrastive with the re-mining hook on a local Ray cluster (`just contrastive
# examples/toy_contrastive/local-remine.yaml`): segment 0 comes from make_blocks.py, every later
# segment is mined by rank 0 with the current encoder at the previous segment's end.
run_name: toy_remine
storage_path: runs/toy_remine
store_root: blocks/toy_remine
seed: 1234
ray_address: null
storage:
  kind: local
log:
  W: 24
  passes: 1
  wait_poll_s: 0.2
checkpoint:
  policy: any
  every_k: 4
  num_to_keep: 3
loader:
  prefetch: 2
  threads: 2
scaling:
  num_workers: 2
  resources_per_worker: {CPU: 1}
failure:
  max_failures: 1
hooks:
  remine:
    entry: examples.toy_contrastive.remine:RemineHook
    segments: 12           # 1.2 passes over the corpus: the last two segments start pass 1
    initial_segments: 1
train:
  n_items: 7680
  features: 32
  clusters: 64
  anchors_per_block: 32
  hard_negatives: 4
  hidden: 64
  embed: 16
  lr: 0.001
  temperature: 0.1
  all_gather: false
