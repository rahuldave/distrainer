[project]
name = "distrainer"
version = "0.0.1"
description = "Block-native distributed training on Ray Train: configurable sub-epoch checkpointing, row-exact resume, elastic world size."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Dave", email = "rahuldave@gmail.com" }]
dependencies = [
  "ray[data,train]==2.58.0",
  "torch>=2.4",
  "pyarrow>=17",
  "pandas>=2.2",
  "pyyaml>=6",
  "fsspec>=2024.6",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.6"]

[project.scripts]
distrainer = "distrainer.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "ty",
]

[tool.uv]
# CPU-only torch wheels for local development on macOS/Linux.
index = [{ name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true }]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude", ".codex", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distrainer"]
