<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         color: #1f2328; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #d1d7e0; background: #0d1117; } a { color: #79b8ff; } }
  header { border-bottom: 1px solid #8884; padding: .6rem 1rem; font-size: .95rem; }
  header a { margin-right: 1.2rem; text-decoration: none; font-weight: 600; }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
  pre { overflow-x: auto; padding: .8rem; background: #8881; border-radius: 6px; }
  code { font-size: .92em; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid #8884; padding: .3rem .6rem; vertical-align: top; }
  .mermaid { margin: 1rem 0; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <a href="https://github.com/rahuldave/distrainer">GitHub</a>
</header>
<main>
{{ content }}
</main>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  for (const code of document.querySelectorAll("pre > code.language-mermaid")) {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  }
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
</body>
</html>
