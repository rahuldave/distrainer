# MinIO for the KubeRay harness (the `minio` argument of `up`): the S3 store for S9, S10 and
# S11s3. The PVC survives `down` (a cold restore needs the bucket) and goes with `nuke`, like the
# compose driver's `minio` volume. Reachable from the pods as http://minio:9000.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  strategy:
    type: Recreate   # one writer on the volume: the old pod goes before the new one starts
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z   # pinned, as in docker-compose.yml
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: "__S3_ACCESS_KEY__" }     # from .env, as compose
            - { name: MINIO_ROOT_PASSWORD, value: "__S3_SECRET_KEY__" }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000 }
    - { name: console, port: 9001 }
