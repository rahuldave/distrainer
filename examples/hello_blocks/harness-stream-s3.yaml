# hello_blocks trained on a log that examples/streaming_producer/produce.py is writing to a bucket
# outside the cluster at the same time (S11s3 on the AWS bed; harness-stream-minio.yaml is the same
# on MinIO, and tests/test_deploy_manifests.py pins the two): the segment file's single S3 put is
# the commit, the ranks poll the bucket for the next segment, and rank 0's gc deletes objects
# behind the retention window. The bucket, endpoint and region are those of harness-s3.yaml.
run_name: hello_stream_s3
storage_path: distrainer-rahuldave/runs        # bucket/prefix
store_root: distrainer-rahuldave/blocks_stream
seed: 7
ray_address: auto
storage:
  kind: s3
  endpoint: https://s3.us-east-1.amazonaws.com   # S3_ACCESS_KEY / S3_SECRET_KEY from the environment
  region: us-east-1
log:
  W: 24
  passes: 1
  wait_poll_s: 0.5
  retention_segments: 2
  gc: true
  gc_blocks: true
  shuffle_buffer_segments: 1
checkpoint:
  policy: any
  every_k: 2
  num_to_keep: 3
loader:
  prefetch: 2
  threads: 2
scaling:
  num_workers: 2
  resources_per_worker: {CPU: 1, trainer: 1}
  elastic_resize_monitor_interval_s: 5
failure:
  max_failures: 3
train:
  rows_per_block: 32
  features: 8
  lr: 0.05
  step_sleep_s: 0.25
