# image_contrastive at GPU size on the RunPod pods (tutorial 6, docs/tutorials/runpod.md), the
# store on the S3 bucket of harness-s3.yaml (hello_blocks): the full ResNet-18 on 49 152 of the
# 50 000 CIFAR-10 training images (192 blocks of 256 = 8 segments of W=24 per pass), 2 passes,
# one GPU per worker, bf16 autocast, a checkpoint every 8 steps (each is a one-second upload).
# Edit the bucket, the endpoint and the region for your account; the pods get S3_ACCESS_KEY and
# S3_SECRET_KEY from the driver.
run_name: images_s3
storage_path: distrainer-rahuldave/runs_images      # bucket/prefix
store_root: distrainer-rahuldave/blocks_images
seed: 1234
ray_address: auto
storage:
  kind: s3
  endpoint: https://s3.us-east-1.amazonaws.com
  region: us-east-1
log:
  W: 24
  passes: 2
  wait_poll_s: 0.5
checkpoint:
  policy: any
  every_k: 8
  num_to_keep: 3
loader:
  prefetch: 2
  threads: 2
scaling:
  num_workers: [1, 2]
  resources_per_worker: {GPU: 1, trainer: 1}
  use_gpu: true
  elastic_resize_monitor_interval_s: 5
failure:
  max_failures: 3
train:
  dataset: cifar10
  data_root: /tmp/datasets                          # the head pod downloads CIFAR-10 once
  n_items: 49152
  n_test: 10000
  rows_per_block: 256
  width: 64
  layers: [2, 2, 2, 2]
  embed: 128
  proj_hidden: 512
  lr: 0.001
  weight_decay: 0.000001
  temperature: 0.1
  all_gather: true
  amp: true
  crop_min_scale: 0.2
  probe_train: 5000
  probe_test: 2000
  probe_k: 20
  probe_device: auto
