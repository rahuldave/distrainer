# distrainer local multi-node harness (spec section 9): containers are Ray nodes.
# Drive it through deploy/driver.sh (project directory = repo root, project name = distrainer).
name: distrainer
services:
  head:
    build: { context: ., dockerfile: deploy/Dockerfile }
    image: distrainer:local
    command: ["deploy/ray-head.sh"]
    ports: ["127.0.0.1:8265:8265"]   # loopback only: OrbStack forwards published ports to the LAN
    shm_size: "1g"
    volumes: &mounts
      - "${DISTRAINER_SHARED:-./.harness/shared}:/shared"
      # source mounted over the image copy: edits on the Mac are live in every node (dev loop)
      - "./distrainer:/app/distrainer:ro"
      - "./examples:/app/examples:ro"
      - "./integration_tests:/app/integration_tests:ro"
    environment: &env
      RAY_TRAIN_V2_ENABLED: "1"
      # declare a dead node dead in ~3 s instead of ~30 s so a restart does not land on it
      RAY_health_check_period_ms: "1000"
      RAY_health_check_timeout_ms: "1000"
      RAY_health_check_failure_threshold: "3"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-distrainer}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-distrainer123}
      S3_REGION: ${S3_REGION:-auto}
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  worker:
    image: distrainer:local
    command: ["deploy/ray-worker.sh"]
    depends_on:
      head: { condition: service_healthy }
    restart: unless-stopped   # a killed worker comes back as a new Ray node (node failure + recovery)
    shm_size: "1g"
    volumes: *mounts
    environment: *env
    deploy: { replicas: 2 }
  minio:
    image: quay.io/minio/minio:latest   # the Docker Hub image was retired
    profiles: [minio]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-distrainer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-distrainer123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:   # the image ships neither mc nor curl; probe the port with bash
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  minio: {}
