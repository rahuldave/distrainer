# image_contrastive on a local Ray cluster, CPU size: a 3072-image subset of CIFAR-10 (the
# torchvision download, 170 MB once, cached under .harness/datasets) in 24 blocks of 128, W=12
# (2 segments per pass), 2 passes, 2 workers, a tiny ResNet (width 16, one block per stage).
# About a minute; the kNN probe on 1000 held-out images should land well above the 0.10 chance.
run_name: images
storage_path: runs/images
store_root: blocks/images
seed: 1234
ray_address: null
storage:
  kind: local
log:
  W: 12
  passes: 2
  wait_poll_s: 0.5
checkpoint:
  policy: any
  every_k: 4
  num_to_keep: 3
loader:
  prefetch: 2
  threads: 2
scaling:
  num_workers: 2
  resources_per_worker: {CPU: 1}
  use_gpu: false
failure:
  max_failures: 1
train:
  dataset: cifar10
  data_root: .harness/datasets
  n_items: 3072            # a seeded subset of the 50 000 training images: 24 blocks of 128
  n_test: 1000             # the held-out split kept for the probe
  rows_per_block: 128
  width: 16
  layers: [1, 1, 1, 1]
  embed: 32
  proj_hidden: 64
  lr: 0.001
  temperature: 0.1
  all_gather: true
  crop_min_scale: 0.2
  probe_train: 1024
  probe_test: 1000
  probe_k: 20
